<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SwitchMate — Tap the Dot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overflow: hidden;
    position: relative;
    padding: 20px;
  }

  .game-area {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .start-screen { text-align: center; }
  .start-screen .emoji { font-size: clamp(4rem, 20vw, 7rem); margin-bottom: 12px; }
  .start-screen .hint {
    font-size: clamp(1rem, 4vw, 1.5rem);
    color: rgba(255,255,255,0.7);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  .play-area {
    position: relative;
    width: min(350px, 80vw);
    height: min(350px, 80vw);
    background: rgba(255,255,255,0.15);
    border-radius: 24px;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.2);
  }

  .dot {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.15s;
    z-index: 5;
  }
  .dot.show { animation: dotIn 0.3s ease-out; }
  @keyframes dotIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .dot.hit { animation: dotHit 0.3s ease-out forwards; }
  @keyframes dotHit { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  .dot.miss { animation: dotMiss 0.4s ease-out forwards; }
  @keyframes dotMiss { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.3); opacity: 0; } }

  .ring-progress { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }
  .ring-progress svg { width: 100%; height: 100%; }

  .combo {
    position: absolute;
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    font-weight: 700;
    color: #fff;
    pointer-events: none;
    animation: comboUp 0.8s ease-out forwards;
    z-index: 10;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  @keyframes comboUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
  }

  .status {
    font-size: clamp(0.9rem, 3.5vw, 1.2rem);
    color: rgba(255,255,255,0.8);
    text-align: center;
    min-height: 28px;
    font-weight: 600;
  }

  .hold-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 6px; background: transparent; z-index: 60; pointer-events: none;
  }
  .hold-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4CAF50, #FFD700, #FF5722);
    transition: width 0.1s linear;
    border-radius: 0 3px 3px 0;
  }
  .hold-status {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 1rem; color: #FFD700; z-index: 60; pointer-events: none;
    opacity: 0; transition: opacity 0.2s; text-align: center;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  .hold-status.show { opacity: 1; }

  .help-btn {
    position: fixed; top: 16px;
    left: 16px;
    width: 56px;
    height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.4);
    color: rgba(255,255,255,0.8);
    font-size: 1.8rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 50;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .help-btn:active { background: rgba(255,255,255,0.4); }

  .help-overlay {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    justify-content: center; align-items: center;
    padding: 20px;
  }
  .help-overlay.show { display: flex; }
  .help-box {
    background: #fff; border-radius: 24px;
    padding: 28px 24px;
    width: 100%; max-width: 360px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .help-box h2 { text-align: center; margin-bottom: 20px; color: #333; font-weight: 700; }
  .help-section { margin-bottom: 18px; }
  .help-section .title { font-weight: 700; color: #555; font-size: 0.9rem; margin-bottom: 8px; text-align: center; }
  .help-row {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 10px 12px;
    background: #f5f6fa; border-radius: 14px; margin-bottom: 6px;
  }
  .help-row .gesture { font-size: 1.8rem; min-width: 44px; text-align: center; }
  .help-row .arrow { color: #bbb; font-size: 1.2rem; font-weight: 300; }
  .help-row .desc { font-size: 1.1rem; font-weight: 600; color: #333; }
  .help-row .desc-sub { font-size: 0.85rem; color: #999; font-weight: 400; margin-left: 4px; }
  .help-close {
    display: block; width: 100%; padding: 14px; margin-top: 12px;
    background: #333; color: #fff; border: none; border-radius: 14px;
    font-size: 1.1rem; font-weight: 700; cursor: pointer;
    touch-action: manipulation; text-align: center;
  }
  .help-close:active { background: #555; }
</style>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="game-area">
  <div id="startScreen" class="start-screen">
    <div class="emoji">🎯</div>
    <div class="hint">Tap to play!</div>
  </div>

  <div id="gameContent" style="display:none;text-align:center">
    <div class="play-area" id="playArea">
      <div class="ring-progress">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
          <circle id="timerRing" cx="50" cy="50" r="45" fill="none" stroke="#fff" stroke-width="3"
                  stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0"
                  transform="rotate(-90 50 50)" style="transition: stroke-dashoffset 0.05s linear"/>
        </svg>
      </div>
      <div class="dot" id="dot" style="display:none"></div>
    </div>
    <div class="status" id="statusText"></div>
  </div>
</div>

<button class="help-btn" id="helpBtn" onclick="showHelp()">?</button>

<div class="help-overlay" id="helpOverlay">
  <div class="help-box">
    <h2>How To Use</h2>
    <div class="help-section">
      <div class="title">👆 Touch (iPad)</div>
      <div class="help-row"><span class="gesture">👆</span><span class="arrow">→</span><span class="desc">Tap <span class="desc-sub">quick</span></span></div>
      <div class="help-row"><span class="gesture">✋</span><span class="arrow">→</span><span class="desc">Hold <span class="desc-sub">2s</span></span></div>
      <div class="help-row"><span class="gesture">✋</span><span class="arrow">→</span><span class="desc">Hold <span class="desc-sub">10s</span></span></div>
    </div>
    <div class="help-section">
      <div class="title">⌨️ Keyboard</div>
      <div class="help-row"><span class="gesture">␣/↵</span><span class="arrow">→</span><span class="desc">Select</span></div>
      <div class="help-row"><span class="gesture">Esc</span><span class="arrow">→</span><span class="desc">Back</span></div>
    </div>
    <div style="text-align:center;margin-top:12px"><a href="../guide.html" style="display:inline-block;padding:10px 24px;background:#4A7BC4;color:#fff;border-radius:60px;text-decoration:none;font-weight:700;font-size:0.95rem;touch-action:manipulation">▶️ Start Guided Tour</a></div>
    <button class="help-close" onclick="hideHelp()">Got it</button>
  </div>
</div>

<div class="hold-bar" id="holdBar"><div class="hold-fill" id="holdFill"></div></div>
<div class="hold-status" id="holdStatus"></div>

<script>
const TOTAL = 15;
const MIN_SZ = 30, MAX_SZ = 80;
const MIN_T = 1000, MAX_T = 3000;

let score = 0, streak = 0, best = 0, round = 0;
let dotVisible = false, dotTimer = null, fadeTimer = null, gameActive = false;

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameContent').style.display = 'block';
  score = 0; streak = 0; best = 0; round = 0; gameActive = true;
  document.getElementById('statusText').textContent = '';
  nextRound();
}

function rng(min, max) { return Math.random() * (max - min) + min; }

function showDot() {
  const dot = document.getElementById('dot');
  const area = document.getElementById('playArea');
  const size = rng(MIN_SZ, MAX_SZ);
  const x = Math.max(5, rng(0, area.offsetWidth - size - 10));
  const y = Math.max(5, rng(0, area.offsetHeight - size - 10));
  const hue = Math.floor(rng(0, 360));
  dot.style.width = size + 'px'; dot.style.height = size + 'px';
  dot.style.left = x + 'px'; dot.style.top = y + 'px';
  dot.style.background = `radial-gradient(circle at 35% 35%, hsl(${hue},80%,70%), hsl(${hue},80%,50%))`;
  dot.style.boxShadow = `0 0 20px hsla(${hue},80%,50%,0.5)`;
  dot.className = 'dot show'; dot.style.display = 'block';
  dotVisible = true;
  document.getElementById('statusText').textContent = 'Tap! ⚡';

  const duration = rng(MIN_T, MAX_T);
  let elapsed = 0;
  const tick = 50;
  const ring = document.getElementById('timerRing');
  ring.style.stroke = '#FFD700';

  function tickRing() {
    elapsed += tick;
    ring.style.strokeDashoffset = 282.7 * (1 - Math.min(elapsed/duration, 1));
    if (elapsed < duration && dotVisible) fadeTimer = setTimeout(tickRing, tick);
  }
  fadeTimer = setTimeout(tickRing, tick);

  dotTimer = setTimeout(() => { if (dotVisible) missDot(); }, duration);
}

function missDot() {
  if (!dotVisible) return;
  dotVisible = false;
  clearTimers();
  document.getElementById('dot').className = 'dot miss';
  streak = 0;
  document.getElementById('statusText').textContent = 'Miss! 😅';
  setTimeout(() => { document.getElementById('dot').style.display = 'none'; nextRound(); }, 500);
}

function tapDot() {
  if (!dotVisible || !gameActive) return;
  dotVisible = false; clearTimers();
  document.getElementById('dot').className = 'dot hit';
  score++; streak++; if (streak > best) best = streak;
  document.getElementById('statusText').textContent = streak >= 3 ? `🔥 ${streak}!` : 'Got it! 🎉';
  document.getElementById('timerRing').style.stroke = '#43e97b';

  if (streak >= 3) {
    const c = document.createElement('div'); c.className = 'combo';
    c.textContent = `🔥 ${streak}x!`; c.style.left = '50%'; c.style.top = '50%';
    c.style.transform = 'translate(-50%,-50%)';
    document.getElementById('playArea').appendChild(c);
    setTimeout(() => c.remove(), 900);
  }

  setTimeout(() => {
    document.getElementById('dot').style.display = 'none';
    nextRound();
  }, 400);
}

function nextRound() {
  round++;
  if (round > TOTAL) { endGame(); return; }
  document.getElementById('statusText').textContent = `Round ${round}/${TOTAL}...`;
  setTimeout(() => { if (gameActive) showDot(); }, rng(800, 2500));
}

function endGame() {
  gameActive = false;
  const pct = Math.round((score/TOTAL)*100);
  let m = `🎯 ${score}/${TOTAL}`;
  if (pct >= 90) m += ' Amazing!';
  else if (pct >= 70) m += ' Great!';
  else if (pct >= 50) m += ' Good!';
  else m += ' Again!';
  document.getElementById('statusText').textContent = m;
  document.getElementById('statusText').style.fontSize = '1.2rem';
}

function clearTimers() {
  if (dotTimer) { clearTimeout(dotTimer); dotTimer = null; }
  if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
}

function handleAction() {
  if (!gameActive) { startGame(); return; }
  tapDot();
}

// Touch switch
let touchStart = 0, holdInt = null, holdFired = false;
document.documentElement.addEventListener('touchstart', function(e) {
  if (touchStart) return;
  e.preventDefault();
  touchStart = Date.now(); holdFired = false;
  const fill = document.getElementById('holdFill'); fill.style.width = '0%';
  holdInt = setInterval(() => {
    const elapsed = (Date.now() - touchStart) / 1000;
    document.getElementById('holdFill').style.width = Math.min(100, (elapsed/10)*100) + '%';
    if (elapsed >= 10 && !holdFired) {
      holdFired = true; clearInterval(holdInt); holdInt = null;
      document.getElementById('holdFill').style.width = '100%';
      document.getElementById('holdStatus').textContent = '×'; document.getElementById('holdStatus').classList.add('show');
      setTimeout(() => { window.location.href = '../index.html'; }, 300);
    } else if (elapsed >= 2 && !holdFired) {
      document.getElementById('holdStatus').textContent = 'Hold...'; document.getElementById('holdStatus').classList.add('show');
    }
  }, 50);
}, { passive: false });

document.documentElement.addEventListener('touchend', function(e) {
  if (!touchStart) return;
  const elapsed = (Date.now() - touchStart) / 1000;
  touchStart = 0;
  if (holdInt) { clearInterval(holdInt); holdInt = null; }
  const fill = document.getElementById('holdFill'); const status = document.getElementById('holdStatus');
  fill.style.width = '0%'; status.classList.remove('show');
  if (holdFired) { holdFired = false; return; }
  if (elapsed >= 2) {
    gameActive = false; clearTimers();
    document.getElementById('gameContent').style.display = 'none';
    document.getElementById('startScreen').style.display = 'block';
  } else {
    handleAction();
  }
}, { passive: true });

document.documentElement.addEventListener('touchcancel', function(e) {
  if (holdInt) { clearInterval(holdInt); holdInt = null; }
  touchStart = 0;
  const fill = document.getElementById('holdFill'); if (fill) fill.style.width = '0%';
  const status = document.getElementById('holdStatus'); if (status) status.classList.remove('show');
}, { passive: true });

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { window.location.href = '../index.html'; return; }
  e.preventDefault();
  handleAction();
});

function showHelp() { document.getElementById('helpOverlay').classList.add('show'); }
function hideHelp() { document.getElementById('helpOverlay').classList.remove('show'); }
</script>
<script src="../firebase-init.js"></script>
<script src="../switchmate-tracker.js"></script>
</body>
</html>
