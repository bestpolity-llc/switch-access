name: Fire OS app CI

on:
  push:
    branches: [fire-os-app]
    paths:
      - "android-fire/**"
      - ".github/workflows/fire-os-ci.yml"
  pull_request:
    paths:
      - "android-fire/**"
      - ".github/workflows/fire-os-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate injected JavaScript
        run: node --check android-fire/app/src/main/assets/switch_app_bridge.js

      - name: Lint and build debug APK
        run: gradle -p android-fire :app:lintDebug :app:assembleDebug --stacktrace
