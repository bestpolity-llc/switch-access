name: Fire OS app verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl --fail --location --silent --show-error \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Decode and validate injected JavaScript
        run: |
          base64 --decode android-fire/app/src/main/assets/switch_app_bridge.js.gz.b64 \
            | gzip --decompress > /tmp/switch_app_bridge.js
          node --check /tmp/switch_app_bridge.js

      - name: Lint and build debug APK
        run: gradle -p android-fire :app:lintDebug :app:assembleDebug --stacktrace
