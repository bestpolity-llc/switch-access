name: Usage analytics checks
on:
  pull_request:
    paths: ['**/*.html', 'switchmate-tracker.js', 'shared/**', 'tests/usage-analytics.mjs', '.github/workflows/usage-analytics.yml']
  push:
    branches: ['main']
    paths: ['**/*.html', 'switchmate-tracker.js', 'shared/**', 'tests/usage-analytics.mjs', '.github/workflows/usage-analytics.yml']
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/usage-analytics.mjs
      - run: node tests/shared-access.mjs
