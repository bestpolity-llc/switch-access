name: Rift-Signal browser checks
on:
  pull_request:
    paths:
      - 'games/rift-signal/**'
      - 'tests/rift-signal*.mjs'
      - '.github/workflows/rift-signal.yml'
      - 'index.html'
  push:
    branches: ['codex/rift-signal-switchmate']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/rift-signal-controller.mjs
      - run: npm install --prefix work/rift-tests playwright@1.51.1
      - run: work/rift-tests/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/rift-signal.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rift-signal-browser-screenshots
          path: work/rift-results/
