name: SwitchMate shared access and activity checks
on:
  pull_request:
    paths:
      - 'games/**'
      - 'shared/**'
      - 'tests/**'
      - '.github/workflows/rift-signal.yml'
      - '*.html'
      - 'firebase-init.js'
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/rift-signal-controller.mjs
      - run: node tests/shared-access.mjs
      - run: node tests/american-big-rigs-controller.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm install --prefix work/rift-tests playwright@1.51.1
      - run: work/rift-tests/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/rift-signal.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rift-signal-browser-screenshots
          path: work/rift-results/
